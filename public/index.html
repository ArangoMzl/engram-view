<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Engram View</title>
<link rel="icon" href="engram-icon.png">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Geist:wght@400;500;600;700;800&family=Geist+Mono:wght@400;500;700&display=swap" rel="stylesheet">
<link rel="stylesheet" href="styles.css">
<link rel="stylesheet" href="app.css">
</head>
<body>
<div class="app">
  <aside class="side">
    <div class="brand"><img class="logo" src="engram-icon.png" alt="Engram"><b>engram<span>.view</span></b></div>
    <div class="eyebrow">Explorar</div>
    <nav class="nav" id="nav"></nav>
    <div class="eyebrow">Proyectos</div>
    <nav class="nav scroll" id="projects"></nav>
    <div class="side-foot" id="foot"></div>
  </aside>
  <div class="main">
    <header class="top">
      <label class="search">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><circle cx="11" cy="11" r="7"/><path d="m20 20-3.5-3.5"/></svg>
        <input id="q" placeholder="Buscar en memorias" autocomplete="off" spellcheck="false">
        <kbd>Ctrl K</kbd>
      </label>
      <div class="sp"></div>
      <span class="pill" id="scope"></span>
      <span class="pill" id="demo" hidden>datos de demostración</span>
    </header>
    <main class="view" id="view"></main>
  </div>
</div>
<script src="app.js"></script>
</body>
</html>
